 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ee0bd"/><stop offset="1" stop-color="#8fcaff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
 </defs>
<rect width="1200" height="640" rx="22" fill="url(#bg)"/>
