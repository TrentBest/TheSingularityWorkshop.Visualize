<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Visualize current showcase: procedural exoskeleton and presentation pipeline</title>
<desc id="desc">A technical illustration of an armored exoskeleton silhouette in the center, surrounded by concentric observer-detail rings and a pipeline from semantic parts through mesh generation and WebGPU presentation. It illustrates the current Soldier Field browser lab, not a screenshot or the .NET backend.</desc>
