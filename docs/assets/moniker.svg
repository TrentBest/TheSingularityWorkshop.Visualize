<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">The Singularity Workshop — living moniker</title>
  <desc id="desc">Three centered lines of rainbow-colored letters gently rise, tilt, and shimmer in a dark cyan-lit field.</desc>
  <defs>
    <radialGradient id="field">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020711" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1100" height="360" rx="18" fill="#020711"/>
  <rect width="1100" height="360" rx="18" fill="url(#field)"/>
  <g fill="none" stroke="#00eaff" stroke-opacity=".16">
    <ellipse cx="550" cy="180" rx="390" ry="135" stroke-dasharray="2 12">
      <animateTransform attributeName="transform" type="rotate" from="0 550 180" to="360 550 180" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="550" cy="180" rx="325" ry="108" stroke="#ff2cff" stroke-opacity=".13" stroke-dasharray="1 9">
      <animateTransform attributeName="transform" type="rotate" from="360 550 180" to="0 550 180" dur="37s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-weight="900" text-anchor="middle" filter="url(#glow)">
    <text class="glyph" x="476" y="105" fill="#ff3030" style="--phase:0;animation-delay:0s">T</text><text class="glyph" x="550" y="105" fill="#ff7a00" style="--phase:1;animation-delay:-0.22s">H</text><text class="glyph" x="624" y="105" fill="#ffd34d" style="--phase:2;animation-delay:-0.44s">E</text>
    <text class="glyph" x="210" y="195" fill="#52e05a" style="--phase:3;animation-delay:-0.66s">S</text><text class="glyph" x="278" y="195" fill="#00a8ff" style="--phase:4;animation-delay:-0.88s">I</text><text class="glyph" x="346" y="195" fill="#ff2cff" style="--phase:5;animation-delay:-1.1s">N</text><text class="glyph" x="414" y="195" fill="#ff3030" style="--phase:6;animation-delay:-1.32s">G</text><text class="glyph" x="482" y="195" fill="#ff7a00" style="--phase:7;animation-delay:-1.54s">U</text><text class="glyph" x="550" y="195" fill="#ffd34d" style="--phase:8;animation-delay:-1.76s">L</text><text class="glyph" x="618" y="195" fill="#52e05a" style="--phase:9;animation-delay:-1.98s">A</text><text class="glyph" x="686" y="195" fill="#00a8ff" style="--phase:10;animation-delay:-2.2s">R</text><text class="glyph" x="754" y="195" fill="#ff2cff" style="--phase:11;animation-delay:-2.42s">I</text><text class="glyph" x="822" y="195" fill="#ff3030" style="--phase:12;animation-delay:-2.64s">T</text><text class="glyph" x="890" y="195" fill="#ff7a00" style="--phase:13;animation-delay:-2.86s">Y</text>
    <text class="glyph" x="305" y="285" fill="#ffd34d" style="--phase:14;animation-delay:-3.08s">W</text><text class="glyph" x="375" y="285" fill="#52e05a" style="--phase:15;animation-delay:-3.3s">O</text><text class="glyph" x="445" y="285" fill="#00a8ff" style="--phase:16;animation-delay:-3.52s">R</text><text class="glyph" x="515" y="285" fill="#ff2cff" style="--phase:17;animation-delay:-3.74s">K</text><text class="glyph" x="585" y="285" fill="#ff3030" style="--phase:18;animation-delay:-3.96s">S</text><text class="glyph" x="655" y="285" fill="#ff7a00" style="--phase:19;animation-delay:-4.18s">H</text><text class="glyph" x="725" y="285" fill="#ffd34d" style="--phase:20;animation-delay:-4.4s">O</text><text class="glyph" x="795" y="285" fill="#52e05a" style="--phase:21;animation-delay:-4.62s">P</text>
  </g>
  <path d="M90 322 H1010" stroke="#00eaff" stroke-opacity=".25"/>
  <circle cx="90" cy="322" r="3" fill="#00eaff"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="322" r="3" fill="#ff2cff"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <style>
    .glyph {
      font-size: 72px;
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: wave 7.2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: translateY(0) rotate(-2deg) scaleY(1); opacity: .9; }
      25% { transform: translateY(-7px) rotate(2deg) scaleY(1.04); opacity: 1; }
      50% { transform: translateY(3px) rotate(-1deg) scaleY(.98); opacity: .96; }
      75% { transform: translateY(-3px) rotate(3deg) scaleY(1.02); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glyph { animation: none; }
    }
  </style>
</svg>
