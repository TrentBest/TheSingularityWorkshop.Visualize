<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Visualize living geometry — animated SVG documentation experiment</title>
  <desc id="desc">A point travels along a connected geometric path while linked nodes pulse and a coordinate grid provides reference. Labels show the progression from data to geometry to visible presentation. This is animated SVG artwork; the interactive browser lab is a separate experiment and the C sharp contract proof is documented below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#172f46"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ee0bd"/><stop offset="1" stop-color="#8fcaff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7ee0bd" stop-opacity=".3"/><stop offset="1" stop-color="#7ee0bd" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8fcaff" stroke-opacity=".11" stroke-width="1"/></pattern>
    <path id="route" d="M135 340 C220 180 300 190 385 310 S555 430 640 275 S820 145 900 290 S1035 420 1080 235" fill="none"/>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="24" fill="url(#grid)"/>
  <text x="48" y="54" fill="#7ee0bd" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="3">THE SINGULARITY WORKSHOP · VISUALIZE</text>
  <text x="48" y="102" fill="#edf5fc" font-family="system-ui, sans-serif" font-size="34" font-weight="750">Documentation that moves</text>
  <text x="48" y="134" fill="#b6cadb" font-family="system-ui, sans-serif" font-size="17">Geometry is not just pictured. Its relationships become visible over time.</text>
  <g stroke="#8fcaff" stroke-opacity=".2" stroke-width="1"><path d="M48 175H1152M48 470H1152"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#route" stroke="#36556d" stroke-width="12" opacity=".55"/>
    <use href="#route" stroke="url(#path)" stroke-width="3" stroke-dasharray="7 12" opacity=".95"/>
    <path d="M135 340L385 310L640 275L900 290L1080 235" stroke="#8fcaff" stroke-width="1.5" stroke-dasharray="3 9" opacity=".45"/>
  </g>
  <g fill="#10283a" stroke="#8fcaff" stroke-width="3">
    <circle cx="135" cy="340" r="15"/><circle cx="385" cy="310" r="15"/><circle cx="640" cy="275" r="15"/><circle cx="900" cy="290" r="15"/><circle cx="1080" cy="235" r="15"/>
  </g>
  <g fill="#7ee0bd">
    <circle cx="135" cy="340" r="5"/><circle cx="385" cy="310" r="5"/><circle cx="640" cy="275" r="5"/><circle cx="900" cy="290" r="5"/><circle cx="1080" cy="235" r="5"/>
  </g>
  <g fill="none" stroke="#7ee0bd" stroke-width="2">
    <circle cx="135" cy="340" r="22" opacity=".7"><animate attributeName="r" values="18;31;18" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="385" cy="310" r="22" opacity=".7"><animate attributeName="r" values="18;31;18" dur="3.2s" begin="-0.64s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="275" r="22" opacity=".7"><animate attributeName="r" values="18;31;18" dur="3.2s" begin="-1.28s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="290" r="22" opacity=".7"><animate attributeName="r" values="18;31;18" dur="3.2s" begin="-1.92s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="235" r="22" opacity=".7"><animate attributeName="r" values="18;31;18" dur="3.2s" begin="-2.56s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="46" fill="url(#halo)" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
  <circle r="11" fill="#ffcf86" stroke="#fff1ce" stroke-width="3"><animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
  <g font-family="system-ui, sans-serif">
    <text x="135" y="390" fill="#edf5fc" font-size="15" font-weight="750" text-anchor="middle">DATA</text>
    <text x="385" y="360" fill="#edf5fc" font-size="15" font-weight="750" text-anchor="middle">RELATION</text>
    <text x="640" y="325" fill="#edf5fc" font-size="15" font-weight="750" text-anchor="middle">GEOMETRY</text>
    <text x="900" y="340" fill="#edf5fc" font-size="15" font-weight="750" text-anchor="middle">MOTION</text>
    <text x="1080" y="285" fill="#edf5fc" font-size="15" font-weight="750" text-anchor="middle">PRESENT</text>
    <text x="48" y="515" fill="#7ee0bd" font-size="14" font-weight="800" letter-spacing="1.5">LIVING SVG</text>
    <text x="48" y="542" fill="#d3e2ee" font-size="15">This image animates in the documentation itself.</text>
    <text x="48" y="566" fill="#a9bfd2" font-size="13">It is an SVG presentation experiment—not a claim that the C# GPU backend has rendered this scene.</text>
    <text x="1152" y="515" fill="#8fcaff" font-size="14" font-weight="800" letter-spacing="1.5" text-anchor="end">NEXT: INTERACTIVE LAB ↗</text>
    <text x="1152" y="542" fill="#d3e2ee" font-size="15" text-anchor="end">Adjust the scene, then inspect the C# proof separately.</text>
    <text x="1152" y="566" fill="#a9bfd2" font-size="13" text-anchor="end">Animation respects a reduced-motion preference where supported.</text>
  </g>
  <style>@media (prefers-reduced-motion: reduce) { circle animateMotion, circle animate { display:none; } }</style>
</svg>