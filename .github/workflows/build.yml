name: Build, test, and package Visualize

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Exercise the reusable GUI.SVG package as its own deliverable while the
  # Visualize contract/build lane runs independently. This creates a CI artifact
  # only; it does not publish anything to NuGet.
  gui-svg-package-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GUI source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: GuiSource

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore GUI.SVG
        run: dotnet restore GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj

      - name: Test GUI Core contracts
        run: dotnet test GuiSource/tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release

      - name: Test GUI.SVG contracts
        run: dotnet test GuiSource/tests/SVG.Tests/TheSingularityWorkshop.GUI.SVG.Tests.csproj --configuration Release

      - name: Pack GUI Core dependency
        run: dotnet pack GuiSource/src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --no-restore --output ./artifacts/gui-svg-feed

      - name: Pack GUI.SVG
        run: dotnet pack GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj --configuration Release --no-restore --output ./artifacts/gui-svg-feed

      - name: Verify GUI.SVG package and dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./artifacts/gui-svg-feed -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          core_package="$(find ./artifacts/gui-svg-feed -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Core.*.nupkg' -print -quit)"
          test -n "$package" && test -s "$package" || { echo "GUI.SVG package was not produced."; exit 1; }
          test -n "$core_package" && test -s "$core_package" || { echo "GUI Core dependency package was not produced."; exit 1; }
          unzip -l "$package" > ./artifacts/gui-svg-feed/package-contents.txt
          grep -q 'lib/net8.0/TheSingularityWorkshop.GUI.SVG.dll' ./artifacts/gui-svg-feed/package-contents.txt
          echo "Verified package: $package"
          echo "Verified dependency package: $core_package"

      - name: Generate GUI.SVG feature gallery
        run: dotnet run --project GuiSource/samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./artifacts/gui-svg-gallery.svg

      - name: Verify and upload GUI.SVG feature gallery
        shell: bash
        run: |
          set -euo pipefail
          gallery="./artifacts/gui-svg-gallery.svg"
          test -s "$gallery"
          grep -q '<linearGradient' "$gallery"
          grep -q '<clipPath' "$gallery"
          grep -q '<pattern' "$gallery"
          grep -q '<marker' "$gallery"
          grep -q '<filter' "$gallery"
          grep -q '<feTurbulence' "$gallery"
          grep -q '<feDisplacementMap' "$gallery"
          grep -q '<feComponentTransfer' "$gallery"
          grep -q '<feDiffuseLighting' "$gallery"
          grep -q '<feDistantLight' "$gallery"
          grep -q 'filter="url(#surface-relief)"' "$gallery"
          grep -q 'filter="url(#surface-lighting)"' "$gallery"
          grep -q '<use' "$gallery"
          grep -q '<a ' "$gallery"
          grep -q '<animate' "$gallery"
          grep -q '<mpath' "$gallery"
          grep -q '<set' "$gallery"
          grep -q 'aria-label="GUI.SVG manifestation gallery"' "$gallery"
      - uses: actions/upload-artifact@v7
        with:
          name: gui-svg-feature-gallery
          path: ./artifacts/gui-svg-gallery.svg
          if-no-files-found: error

      - name: Create a package-only consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./package-consumer
          cat > ./package-consumer/PackageConsumer.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.GUI.SVG" Version="0.1.0-alpha.1" />
            </ItemGroup>
          </Project>
          EOF
          cat > ./package-consumer/Program.cs <<'EOF'
          using TheSingularityWorkshop.Workshop.Gui;
          using TheSingularityWorkshop.Workshop.Gui.Svg;

          var scene = GuiBuilder.Create("svg-scene", "package-consumer")
              .Child("svg-circle", "marker", marker => marker
                  .Property("cx", "50").Property("cy", "50").Property("r", "4")
                  .Property("fill", "#7ee0bd"))
              .Build();
          var svg = new SvgGuiRenderer().Render(scene);
          if (!svg.Contains("<svg", StringComparison.Ordinal) ||
              !svg.Contains("id=\"marker\"", StringComparison.Ordinal))
              throw new InvalidOperationException("Packaged GUI.SVG did not render the expected scene.");
          Console.WriteLine("Package-only consumer successfully rendered an SVG scene.");
          EOF

      - name: Restore package-only consumer from local packages
        run: dotnet restore ./package-consumer/PackageConsumer.csproj --source ./artifacts/gui-svg-feed --source https://api.nuget.org/v3/index.json

      - name: Build and run package-only consumer
        run: |
          dotnet build ./package-consumer/PackageConsumer.csproj --configuration Release --no-restore
          dotnet run --project ./package-consumer/PackageConsumer.csproj --configuration Release --no-build

      - name: Upload GUI.SVG package feed
        uses: actions/upload-artifact@v7
        with:
          name: gui-svg-package-feed
          path: ./artifacts/gui-svg-feed/*.nupkg
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Renderer source for the explicit integration adapter
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.Renderer
          ref: development
          path: integrations/RendererAdapter/RendererSource

      - name: Checkout GUI source for the GUI.SVG adapter integration
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: integrations/GuiSvg/GuiSource

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Visualize.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.Visualize.slnx --configuration Release --no-restore

      - name: Generate Visualizer-backed SVG primitive proof
        run: dotnet run --project samples/PrimitiveGallery/VisualizeSvgProof/VisualizeSvgProof.csproj --configuration Release -- ./samples/PrimitiveGallery/generated

      - name: Generate GUI.SVG-backed Visualizer integration proof
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/Proof/GuiSvgProof.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/07-gui-svg-connected-points.svg

      - name: Generate perspective-projected 3D mesh through Visualizer and GUI.SVG
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/Proof/PerspectiveMeshProof.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/08-gui-svg-perspective-mesh.svg

      - name: Generate GUI.SVG feature gallery in the combined proof set
        run: >
          dotnet run --project integrations/GuiSvg/GuiSource/samples/SvgGallery/SvgGallery.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg

      - name: Verify generated Visualizer SVG proof outputs
        shell: bash
        run: |
          set -euo pipefail
          for sample in \
            01-one-point.svg \
            02-point-cloud-100.svg \
            03-four-connected-points.svg \
            04-one-line.svg \
            05-many-lines-24.svg \
            06-lit-hemisphere-normals.svg \
            07-gui-svg-connected-points.svg \
            08-gui-svg-perspective-mesh.svg \
            09-gui-svg-feature-gallery.svg; do
            file="./samples/PrimitiveGallery/generated/$sample"
            test -s "$file" || { echo "Missing or empty Visualizer output: $file"; exit 1; }
            grep -q '<path' "$file" || { echo "No rendered paths in: $file"; exit 1; }
          done
          grep -q 'stroke="#7ee0bd"' ./samples/PrimitiveGallery/generated/06-lit-hemisphere-normals.svg
          grep -q 'attributeName="r"' ./samples/PrimitiveGallery/generated/07-gui-svg-connected-points.svg
          grep -q '<linearGradient' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<pattern' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<marker' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<filter' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feTurbulence' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDisplacementMap' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feComponentTransfer' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDiffuseLighting' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDistantLight' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q 'filter="url(#surface-relief)"' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q 'filter="url(#surface-lighting)"' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<use' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<a ' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<animate' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<mpath' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<set' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg

      - name: Upload Visualizer SVG proof images
        uses: actions/upload-artifact@v7
        with:
          name: visualize-svg-primitive-proof
          path: ./samples/PrimitiveGallery/generated/*.svg
          if-no-files-found: error

      - name: Test with coverage
        run: >
          dotnet test tests/TheSingularityWorkshop.Visualize.Tests/TheSingularityWorkshop.Visualize.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Test GUI.SVG Visualizer backend integration
        run: >
          dotnet test tests/GuiSvgIntegration.Tests/GuiSvgIntegration.Tests.csproj
          --configuration Release
          -p:WorkshopGuiSvgProjectPath=GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
          --verbosity normal

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.Visualize
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack TheSingularityWorkshop.Visualize.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: visualize-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: visualize-test-results
          path: ./TestResults/*

  publish_nuget:
    needs: [build-and-test, gui-svg-package-proof]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: visualize-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
