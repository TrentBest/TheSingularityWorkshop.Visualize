name: Build, test, and package Visualize

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Exercise the reusable GUI.SVG package as its own deliverable while the
  # Visualize contract/build lane runs independently. This creates a CI artifact
  # only; it does not publish anything to NuGet.
  gui-svg-package-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GUI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: GuiSource

      - name: Setup .NET
        uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore GUI.SVG
        run: dotnet restore GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj

      - name: Test GUI Core contracts
        run: dotnet test GuiSource/tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release

      - name: Test GUI.SVG contracts
        run: dotnet test GuiSource/tests/SVG.Tests/TheSingularityWorkshop.GUI.SVG.Tests.csproj --configuration Release

      - name: Generate package-embedded GUI.SVG gallery
        run: >-
          dotnet run --project GuiSource/samples/SvgGallery/SvgGallery.csproj
          --configuration Release
          -- ./GuiSource/artifacts/svg-adapter-gallery.svg
      - name: Verify package gallery matches checked-in generated snapshot
        run: cmp ./GuiSource/artifacts/svg-adapter-gallery.svg ./GuiSource/docs/assets/svg-adapter-gallery.svg

      - name: Pack GUI Core dependency
        run: dotnet pack GuiSource/src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --no-restore --output ./artifacts/gui-svg-feed

      - name: Pack GUI.SVG
        run: dotnet pack GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj --configuration Release --no-restore --output ./artifacts/gui-svg-feed

      - name: Verify GUI.SVG package and dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./artifacts/gui-svg-feed -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          core_package="$(find ./artifacts/gui-svg-feed -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Core.*.nupkg' -print -quit)"
          test -n "$package" && test -s "$package" || { echo "GUI.SVG package was not produced."; exit 1; }
          test -n "$core_package" && test -s "$core_package" || { echo "GUI Core dependency package was not produced."; exit 1; }
          unzip -l "$package" > ./artifacts/gui-svg-feed/package-contents.txt
          grep -q 'lib/net8.0/TheSingularityWorkshop.GUI.SVG.dll' ./artifacts/gui-svg-feed/package-contents.txt
          grep -q 'README.md' ./artifacts/gui-svg-feed/package-contents.txt
          grep -q 'docs/SVG_ADAPTER.md' ./artifacts/gui-svg-feed/package-contents.txt
          grep -q 'docs/assets/svg-adapter-gallery.svg' ./artifacts/gui-svg-feed/package-contents.txt
          echo "Verified package: $package"
          echo "Verified dependency package: $core_package"

      - name: Generate GUI.SVG feature gallery
        run: dotnet run --project GuiSource/samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./artifacts/gui-svg-gallery.svg

      - name: Verify and upload GUI.SVG feature gallery
        shell: bash
        run: |
          set -euo pipefail
          gallery="./artifacts/gui-svg-gallery.svg"
          test -s "$gallery"
          grep -q '<linearGradient' "$gallery"
          grep -q '<clipPath' "$gallery"
          grep -q '<pattern' "$gallery"
          grep -q '<marker' "$gallery"
          grep -q '<filter' "$gallery"
          grep -q '<feTurbulence' "$gallery"
          grep -q '<feDisplacementMap' "$gallery"
          grep -q '<feComponentTransfer' "$gallery"
          grep -q '<feDiffuseLighting' "$gallery"
          grep -q '<feDistantLight' "$gallery"
          grep -q 'filter="url(#surface-relief)"' "$gallery"
          grep -q 'filter="url(#surface-lighting)"' "$gallery"
          grep -q '<use' "$gallery"
          grep -q '<a ' "$gallery"
          grep -q '<animate' "$gallery"
          grep -q '<mpath' "$gallery"
          grep -q '<set' "$gallery"
          grep -q 'aria-label="GUI.SVG manifestation gallery"' "$gallery"
      - uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: gui-svg-feature-gallery
          path: ./artifacts/gui-svg-gallery.svg
          if-no-files-found: error

      - name: Create a package-only consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./package-consumer
          cat > ./package-consumer/PackageConsumer.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.GUI.SVG" Version="0.1.0-alpha.1" />
            </ItemGroup>
          </Project>
          EOF
          cat > ./package-consumer/Program.cs <<'EOF'
          using TheSingularityWorkshop.Workshop.Gui;
          using TheSingularityWorkshop.Workshop.Gui.Svg;

          var scene = GuiBuilder.Create("svg-scene", "package-consumer")
              .Child("svg-circle", "marker", marker => marker
                  .Property("cx", "50").Property("cy", "50").Property("r", "4")
                  .Property("fill", "#7ee0bd"))
              .Build();
          var svg = new SvgGuiRenderer().Render(scene);
          if (!svg.Contains("<svg", StringComparison.Ordinal) ||
              !svg.Contains("id=\"marker\"", StringComparison.Ordinal))
              throw new InvalidOperationException("Packaged GUI.SVG did not render the expected scene.");
          Console.WriteLine("Package-only consumer successfully rendered an SVG scene.");
          EOF

      - name: Restore package-only consumer from local packages
        run: dotnet restore ./package-consumer/PackageConsumer.csproj --source ./artifacts/gui-svg-feed --source https://api.nuget.org/v3/index.json

      - name: Build and run package-only consumer
        run: |
          dotnet build ./package-consumer/PackageConsumer.csproj --configuration Release --no-restore
          dotnet run --project ./package-consumer/PackageConsumer.csproj --configuration Release --no-build

      - name: Upload GUI.SVG package feed
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: gui-svg-package-feed
          path: ./artifacts/gui-svg-feed/*.nupkg
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Renderer source for the explicit integration adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.Renderer
          ref: development
          path: integrations/RendererAdapter/RendererSource

      - name: Checkout GUI source for the GUI.SVG adapter integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: integrations/GuiSvg/GuiSource

      - name: Setup .NET
        uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Visualize.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.Visualize.slnx --configuration Release --no-restore

      - name: Generate and verify deterministic array-first workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project samples/ArrayFirstWorkload/Generator/ArrayFirstWorkload.Generator.csproj --configuration Release -- 100 ./artifacts/array-first-workload-100
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/array-first-workload-100")
          manifest = json.loads((root / "dataset-manifest.json").read_text(encoding="utf-8"))
          assert manifest["SchemaVersion"] == 1
          assert manifest["InstanceCount"] == 100
          assert manifest["InstanceStrideBytes"] == 80
          for name, record in manifest["Files"].items():
              data = (root / name).read_bytes()
              if len(data) != record["Bytes"]:
                  raise SystemExit(f"Byte count mismatch for {name}")
              if hashlib.sha256(data).hexdigest() != record["Sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {name}")
          PY

      - name: Validate browser WebGPU modules and behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re

          runners = {
              "array-first": Path("samples/ArrayFirstWorkload/WebGpuRunner/index.html"),
              "soldier-field": Path("samples/SoldierField/WebGpuRunner/index.html"),
          }
          for name, source in runners.items():
              html = source.read_text(encoding="utf-8")
              match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
              if not match:
                  raise SystemExit(f"Could not find the inline module script in {source}")
              Path(f"/tmp/{name}-webgpu-runner.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/array-first-webgpu-runner.mjs
          node --check /tmp/soldier-field-webgpu-runner.mjs
          node --test samples/ArrayFirstWorkload/WebGpuRunner/renderer-trace.test.mjs
          node --test samples/SoldierField/WebGpuRunner/soldier-geometry.test.mjs samples/SoldierField/WebGpuRunner/soldier-cut-sheet.test.mjs samples/SoldierField/WebGpuRunner/soldier-research-simulation.test.mjs

      - name: Generate Visualizer-backed SVG primitive proof
        run: dotnet run --project samples/PrimitiveGallery/VisualizeSvgProof/VisualizeSvgProof.csproj --configuration Release -- ./samples/PrimitiveGallery/generated

      - name: Generate GUI.SVG-backed Visualizer integration proof
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/Proof/GuiSvgProof.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/07-gui-svg-connected-points.svg

      - name: Generate perspective-projected 3D mesh through Visualizer and GUI.SVG
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/Proof/PerspectiveMeshProof.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/08-gui-svg-perspective-mesh.svg

      - name: Generate Renderer-selected frame through Visualize and GUI.SVG
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/RendererAdapter/Proof/RendererFrameToSvgProof.csproj
          --configuration Release
          -- ./artifacts/renderer-selected-frame.svg

      - name: Verify and upload the Renderer-to-Visualize integration proof
        shell: bash
        run: |
          set -euo pipefail
          proof="./artifacts/renderer-selected-frame.svg"
          test -s "$proof"
          grep -q '<path' "$proof"
          grep -q 'Visualizer frame manifested through GUI.SVG' "$proof"
          echo "Verified executable Renderer -> Visualizer -> GUI.SVG proof: $proof"

      - name: Upload Renderer-to-Visualize frame proof
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-to-visualize-frame-proof
          path: ./artifacts/renderer-selected-frame.svg
          if-no-files-found: error

      - name: Generate the same city scene through Visualizer for three material skins
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/CityMassingProof/CityMassingProof.csproj
          --configuration Release
          -- ./samples/CityMassing/generated

      - name: Generate deterministic Extremus crowd instance SVG proof
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run --project integrations/GuiSvg/ExtremusCrowdProof/ExtremusCrowdProof.csproj
          --configuration Release
          -- ./samples/ExtremusCrowd/generated

      - name: Generate GUI.SVG feature gallery in the combined proof set
        run: >
          dotnet run --project integrations/GuiSvg/GuiSource/samples/SvgGallery/SvgGallery.csproj
          --configuration Release
          -- ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg

      - name: Verify generated Visualizer SVG proof outputs
        shell: bash
        run: |
          set -euo pipefail
          for sample in \
            01-one-point.svg \
            02-point-cloud-100.svg \
            03-four-connected-points.svg \
            04-one-line.svg \
            05-many-lines-24.svg \
            06-lit-hemisphere-normals.svg \
            07-gui-svg-connected-points.svg \
            08-gui-svg-perspective-mesh.svg \
            09-gui-svg-feature-gallery.svg; do
            file="./samples/PrimitiveGallery/generated/$sample"
            test -s "$file" || { echo "Missing or empty Visualizer output: $file"; exit 1; }
            grep -q '<path' "$file" || { echo "No rendered paths in: $file"; exit 1; }
          done
          grep -q 'stroke="#7ee0bd"' ./samples/PrimitiveGallery/generated/06-lit-hemisphere-normals.svg
          grep -q 'attributeName="r"' ./samples/PrimitiveGallery/generated/07-gui-svg-connected-points.svg
          grep -q '<linearGradient' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<pattern' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<marker' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<filter' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feTurbulence' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDisplacementMap' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feComponentTransfer' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDiffuseLighting' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<feDistantLight' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q 'filter="url(#surface-relief)"' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q 'filter="url(#surface-lighting)"' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<use' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<a ' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<animate' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<mpath' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          grep -q '<set' ./samples/PrimitiveGallery/generated/09-gui-svg-feature-gallery.svg
          for skin in noir metro harmony; do
            file="./samples/CityMassing/generated/singularity-city-$skin.svg"
            test -s "$file" || { echo "Missing city skin output: $file"; exit 1; }
            grep -q 'Singularity City /' "$file"
            grep -q 'draw-' "$file"
          done
          grep -q 'fill="#050a12"' ./samples/CityMassing/generated/singularity-city-noir.svg
          grep -q 'fill="#edf4e9"' ./samples/CityMassing/generated/singularity-city-harmony.svg
          report="./samples/CityMassing/generated/city-massing-report.json"
          test -s "$report" || { echo "Missing machine-readable city proof report."; exit 1; }
          python -c 'import json; p="'"$report"'"; rows=json.load(open(p)); assert len(rows)==3, rows; assert all(r["sourceFaces"] > r["submittedFaces"] for r in rows), rows; assert all(r["omittedWindowDetailFaces"] > 0 for r in rows), rows; assert all(r["backend"] == "CPU/SVG" for r in rows), rows; print(json.dumps(rows, indent=2))'
          crowd_dir="./samples/ExtremusCrowd/generated"
          crowd_svg="$crowd_dir/extremus-crowd.svg"
          crowd_manifest="$crowd_dir/extremus-crowd-manifest.json"
          test -s "$crowd_svg" || { echo "Missing Extremus crowd SVG."; exit 1; }
          test -s "$crowd_manifest" || { echo "Missing Extremus crowd manifest."; exit 1; }
          grep -q 'Extremus deterministic crowd layout' "$crowd_svg"
          python -c 'import json, pathlib; p=pathlib.Path("'"$crowd_manifest"'"); r=json.loads(p.read_text()); assert r["source"]["consumesGesturesBake"] is False, r; assert r["backend"]["execution"] == "CPU" and r["backend"]["hardwareGpuInstancing"] is False, r; assert r["counts"]["representedPopulation"] == 24 and r["counts"]["instanceRecords"] == 24, r; assert r["counts"]["drawCommands"] == 1 and r["repeatability"]["identicalInputProducedIdenticalSvg"] is True, r; assert r["repeatability"]["missingInstanceResourceRejected"] is True, r; assert len(r["records"]) == 24, r; assert r["output"]["svgBytes"] == len(pathlib.Path("'"$crowd_svg"'").read_bytes()), r; print(json.dumps({"counts": r["counts"], "output": r["output"]}, indent=2))'

      - name: Upload Visualizer SVG proof images
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: visualize-svg-primitive-proof
          path: ./samples/PrimitiveGallery/generated/*.svg
          if-no-files-found: error

      - name: Upload Visualizer-backed city massing skins and proof report
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: visualize-city-massing-proof
          path: |
            ./samples/CityMassing/generated/*.svg
            ./samples/CityMassing/generated/city-massing-report.json
          if-no-files-found: error
      
      - name: Upload deterministic Extremus crowd SVG and manifest
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: visualize-extremus-crowd-proof
          path: |
            ./samples/ExtremusCrowd/generated/extremus-crowd.svg
            ./samples/ExtremusCrowd/generated/extremus-crowd-manifest.json
          if-no-files-found: error

      - name: Test with coverage
        run: >
          dotnet test tests/TheSingularityWorkshop.Visualize.Tests/TheSingularityWorkshop.Visualize.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Test GUI.SVG Visualizer backend integration
        run: >
          dotnet test tests/GuiSvgIntegration.Tests/GuiSvgIntegration.Tests.csproj
          --configuration Release
          -p:WorkshopGuiSvgProjectPath=GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
          --verbosity normal

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Check whether Codecov upload is configured
        id: codecov-config
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured; coverage upload will be skipped. Coverage files remain available as workflow artifacts."
          fi
      - name: Upload coverage to Codecov
        if: ${{ steps.codecov-config.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.Visualize
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack TheSingularityWorkshop.Visualize.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: visualize-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: visualize-test-results
          path: ./TestResults/*

  drone-construction-frame-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Visualize
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Experiences simulation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.Experiences
          ref: development
          path: ExperiencesSource
          sparse-checkout: |
            src/DroneConstruction
          sparse-checkout-cone-mode: true

      - name: Checkout Renderer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.Renderer
          ref: development
          path: integrations/RendererAdapter/RendererSource

      - name: Checkout GUI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: integrations/GuiSvg/GuiSource

      - name: Setup .NET
        uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Generate Drone Construction frame from committed simulation snapshot
        env:
          WorkshopGuiSvgProjectPath: GuiSource/src/SVG/TheSingularityWorkshop.GUI.SVG.csproj
        run: >
          dotnet run
          --project integrations/RendererAdapter/DroneConstructionProof/DroneConstructionFrameProof.csproj
          --configuration Release
          -- ./artifacts/drone-construction-frame.svg

      - name: Verify Drone Construction frame and manifest
        shell: bash
        run: |
          set -euo pipefail
          svg="./artifacts/drone-construction-frame.svg"
          manifest="./artifacts/drone-construction-frame.manifest.txt"
          test -s "$svg"
          test -s "$manifest"
          grep -q '<path' "$svg"
          grep -qx 'run=drone-construction-renderer-proof' "$manifest"
          grep -qx 'spaceKind=SimulationGrid' "$manifest"
          grep -qx 'spaceId=construction-proof-grid' "$manifest"
          grep -qx 'observerSequence=1' "$manifest"
          grep -qx 'authoritativeAgents=3' "$manifest"
          grep -qx 'submittedDraws=3' "$manifest"
          grep -qx 'entityIds=101,202,303' "$manifest"
          grep -qx 'backend=CPU/SVG' "$manifest"

      - name: Upload Drone Construction frame proof
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: drone-construction-frame-proof
          path: |
            ./artifacts/drone-construction-frame.svg
            ./artifacts/drone-construction-frame.manifest.txt
          if-no-files-found: error

  publish_nuget:
    needs: [build-and-test, gui-svg-package-proof]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@e455989ae00f5bdd4054f05d3e972c6bf8a62dc5 # v8.0.2
        with:
          name: visualize-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
